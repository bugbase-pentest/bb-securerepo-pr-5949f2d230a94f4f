name: BugBase WRP Harden Runner Presence disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        if: ${{ false }}
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Marker after skipped Harden Runner
        run: echo "bb-wrp-runtime-disabled-enforce-ms38o039"
