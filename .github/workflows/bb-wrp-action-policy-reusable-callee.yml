name: BugBase reusable workflow with unallowed action

on:
  workflow_call:

permissions:
  contents: read

jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Unallowed action in reusable workflow
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Marker after reusable unallowed action
        run: echo "bb-wrp-runtime-action-reusable-unallowed-enforce-ms3bnpjm-reusable-action"
