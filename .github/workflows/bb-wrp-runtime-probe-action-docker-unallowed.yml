name: BugBase WRP Allowed Actions action-docker-unallowed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Unallowed Docker container action
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/echo
          args: bb-wrp-runtime-action-docker-unallowed-enforce-ms3c02p3-docker-action
      - name: Marker after Docker container action
        run: echo "bb-wrp-runtime-action-docker-unallowed-enforce-ms3c02p3"
